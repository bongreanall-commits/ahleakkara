<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E1E" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#D9480F" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD206" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="3" />

  <!-- Boutique Hanger / Crown Arch -->
  <path d="M 60 22 C 60 16 66 16 66 20 C 66 25 56 26 56 31 L 56 34 L 64 34" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 32 46 L 60 34 L 88 46" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram A + K (Ah Leak x Kara) -->
  <!-- Letter A -->
  <path d="M 36 86 L 48 50 L 60 86" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 40 74 L 56 74" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Intersecting Letter K / Khmer Crown -->
  <path d="M 65 50 L 65 86" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 84 52 L 66 68 L 86 86" fill="none" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Subtle Diamond Sparkle at Center -->
  <circle cx="60" cy="34" r="2" fill="#FCD206" />
  <circle cx="60" cy="98" r="2.5" fill="url(#accentGrad)" />
</svg>